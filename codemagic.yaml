workflows:
  ios-testflight:
    name: Jet Set LatAm — iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Set this up in Codemagic → Teams → Integrations → App Store Connect.
      # Give the integration this same name so the reference below resolves.
      app_store_connect: codemagic
    environment:
      groups:
        - app_store_credentials # bundle identifier, team ID (add in Codemagic → Environment variables)
      vars:
        BUNDLE_ID: "com.jetsetlatam.app"
        XCODE_WORKSPACE: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 22.22.2
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Build web app
        script: |
          npm run build
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Increment build number
        script: |
          cd ios/App
          agvtool new-version -all $(($(app-store-connect get-latest-build-number "$BUNDLE_ID") + 1))
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Flip to true once you're ready for reviewers beyond internal testers.
        # submit_to_app_store: false
