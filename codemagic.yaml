workflows:
  ios-testflight:
    name: Jet Set LatAm — iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Set up in Codemagic → Team settings → Integrations → App Store Connect.
      # Name the integration exactly "codemagic" so this reference resolves.
      app_store_connect: codemagic
    environment:
      vars:
        BUNDLE_ID: "com.jetsetlatam.app"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 22.22.2
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Build web app
        script: |
          npm run build
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Install signing files
        # Uses a dedicated certificate generated specifically for this app
        # (Apple's API can't hand out private keys for certs it didn't
        # generate, so app-store-connect fetch-signing-files can't be used
        # here). Set CERTIFICATE_P12_BASE64, CERTIFICATE_P12_PASSWORD, and
        # PROVISIONING_PROFILE_BASE64 as secure environment variables in
        # Codemagic → this app → Environment variables.
        script: |
          echo $CERTIFICATE_P12_BASE64 | base64 --decode > /tmp/certificate.p12
          keychain add-certificates --certificate /tmp/certificate.p12 --certificate-password $CERTIFICATE_P12_PASSWORD
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo $PROVISIONING_PROFILE_BASE64 | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/jetsetlatam.mobileprovision"
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Flip to true once you're ready for reviewers beyond internal testers.
        # submit_to_app_store: false
