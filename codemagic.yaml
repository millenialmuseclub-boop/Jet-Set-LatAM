workflows:
  ios-testflight:
    name: Jet Set LatAm — iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Set up in Codemagic → Team settings → Integrations → App Store Connect.
      # Name the integration exactly "codemagic" so this reference resolves.
      app_store_connect: codemagic
    environment:
      # ios-testflight holds CERTIFICATE_P12_BASE64 / CERTIFICATE_P12_PASSWORD
      # (and PROVISIONING_PROFILE_B...) as secure vars in Codemagic → this
      # app → Environment variables. Without importing the group here, those
      # never reach the shell — $CERTIFICATE_P12_PASSWORD expanded to an
      # empty string, `keychain add-certificates --certificate-password`
      # got no argument, the cert import silently failed, and the archive
      # step then had no distribution certificate/private key to sign with
      # ("No signing certificate 'iOS Distribution' found ... with a
      # private key"). Confirmed from the actual build-6aa44036 raw log.
      groups:
        - ios-testflight
      vars:
        BUNDLE_ID: "com.jetsetlatam.app"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 22.22.2
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: ios-*
          include: true
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Build web app
        script: |
          npm run lint
          npm run check:ota
          npm run build
      - name: Sync Capacitor iOS
        script: |
          export APP_BUILD_VERSION=$(git log -1 --format=%ct)
          npx cap sync ios
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Install signing files
        # Uses a dedicated certificate generated specifically for this app
        # (Apple's API can't hand out private keys for certs it didn't
        # generate, so app-store-connect fetch-signing-files can't be used
        # here). Set CERTIFICATE_P12_BASE64 and CERTIFICATE_P12_PASSWORD as
        # secure environment variables in Codemagic → this app → Environment
        # variables (the .p12 contains the private key, so it stays a
        # secret). The provisioning profile itself has no private key in
        # it, so it's committed directly to the repo (codemagic-signing/)
        # instead of pasted as a giant base64 env var — that 16KB manual
        # paste was the actual cause of an earlier "Invalid provisioning
        # profile: Error reading S/MIME message" failure (silent
        # truncation/corruption on copy), not a real signing problem.
        script: |
          echo $CERTIFICATE_P12_BASE64 | base64 --decode > /tmp/certificate.p12
          keychain add-certificates --certificate /tmp/certificate.p12 --certificate-password $CERTIFICATE_P12_PASSWORD
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp codemagic-signing/jetsetlatam.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/jetsetlatam.mobileprovision"
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            || (echo "===== RAW XCODEBUILD LOG (tail -c 20000) ====="; \
                tail -c 20000 /tmp/xcodebuild_logs/*.log 2>&1; \
                echo "===== END RAW LOG ====="; \
                exit 65)
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Flip to true once you're ready for reviewers beyond internal testers.
        # submit_to_app_store: false
